<?xml version="1.0" encoding="UTF-8"?>
<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="pl-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(20,20)" filter="url(#glow)">
    
    <line x1="20" y1="60" x2="60" y2="20" stroke="url(#pl-gradient)" stroke-width="3"/>
    <line x1="60" y1="20" x2="110" y2="40" stroke="url(#pl-gradient)" stroke-width="3"/>
    <line x1="60" y1="20" x2="60" y2="80" stroke="url(#pl-gradient)" stroke-width="3"/>
    
    <line x1="20" y1="60" x2="60" y2="20" stroke="#00F0FF" stroke-width="4"/>
    
    <circle cx="20" cy="60" r="8" fill="#0F1C2E" stroke="url(#pl-gradient)" stroke-width="3"/>
    <circle cx="60" cy="20" r="8" fill="#0F1C2E" stroke="url(#pl-gradient)" stroke-width="3"/>
    <circle cx="110" cy="40" r="8" fill="#0F1C2E" stroke="url(#pl-gradient)" stroke-width="3"/>
    <circle cx="60" cy="80" r="8" fill="#0F1C2E" stroke="url(#pl-gradient)" stroke-width="3"/>
  </g>

  <text x="160" y="70"
        font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="42"
        font-weight="600"
        fill="url(#pl-gradient)">
    PathLink
  </text>

</svg>
